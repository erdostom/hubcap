services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — TLS termination + routing by subdomain
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: hubcap-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SIGNOZ_DOMAIN: ${SIGNOZ_DOMAIN:?Set SIGNOZ_DOMAIN in .env}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?Set GLITCHTIP_DOMAIN in .env}
      OTEL_DOMAIN: ${OTEL_DOMAIN:?Set OTEL_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signoz
      - glitchtip-web
    networks:
      - hubcap

  # ---------------------------------------------------------------------------
  # APM + metrics + logs — SigNoz (ClickHouse-backed)
  # ---------------------------------------------------------------------------
  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: hubcap-signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-quantile for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts/
    networks:
      - hubcap

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: hubcap-signoz-zookeeper
    restart: unless-stopped
    environment:
      - ZOO_SERVER_ID=${ZOO_SERVER_ID:?Set ZOO_SERVER_ID in .env}
      - ALLOW_ANONYMOUS_LOGIN=${ALLOW_ANONYMOUS_LOGIN:?Set ALLOW_ANONYMOUS_LOGIN in .env}
      - ZOO_AUTOPURGE_INTERVAL=${ZOO_AUTOPURGE_INTERVAL:?Set ZOO_AUTOPURGE_INTERVAL in .env}
      - ZOO_ENABLE_PROMETHEUS_METRICS=${ZOO_ENABLE_PROMETHEUS_METRICS:?Set ZOO_ENABLE_PROMETHEUS_METRICS in .env}
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=${ZOO_PROMETHEUS_METRICS_PORT_NUMBER:?Set ZOO_PROMETHEUS_METRICS_PORT_NUMBER in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - signoz_zookeeper:/bitnami/zookeeper
    networks:
      - hubcap

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: hubcap-signoz-clickhouse
    restart: unless-stopped
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./signoz/clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts/
      - signoz_clickhouse:/var/lib/clickhouse/
    networks:
      - hubcap

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.3
    container_name: hubcap-signoz-telemetrystore-migrator
    restart: on-failure
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN in .env}
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER in .env}
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION in .env}
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_TIMEOUT:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_TIMEOUT in .env}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    networks:
      - hubcap

  signoz:
    image: signoz/signoz:v0.120.0
    container_name: hubcap-signoz
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # UI — only accessible via Caddy reverse proxy
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=${SIGNOZ_ALERTMANAGER_PROVIDER:?Set SIGNOZ_ALERTMANAGER_PROVIDER in .env}
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=${SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN:?Set SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN in .env}
      - SIGNOZ_SQLSTORE_SQLITE_PATH=${SIGNOZ_SQLSTORE_SQLITE_PATH:?Set SIGNOZ_SQLSTORE_SQLITE_PATH in .env}
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_TOKENIZER_JWT_SECRET:?Load SIGNOZ_TOKENIZER_JWT_SECRET from 1Password}
    volumes:
      - signoz_sqlite:/var/lib/signoz/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    networks:
      - hubcap

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.144.3
    container_name: hubcap-signoz-otel-collector
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:?Set OTEL_RESOURCE_ATTRIBUTES in .env}
      - LOW_CARDINAL_EXCEPTION_GROUPING=${LOW_CARDINAL_EXCEPTION_GROUPING:?Set LOW_CARDINAL_EXCEPTION_GROUPING in .env}
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN in .env}
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER in .env}
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION in .env}
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=${SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_TIMEOUT:?Set SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_TIMEOUT in .env}
    ports:
      - "4317:4317"   # OTLP gRPC — Rails apps send traces/metrics/logs here
      - "4318:4318"   # OTLP HTTP — alternative for apps that prefer HTTP
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    networks:
      - hubcap

  # ---------------------------------------------------------------------------
  # Exception tracking — GlitchTip
  # ---------------------------------------------------------------------------
  glitchtip-migrate:
    image: glitchtip/glitchtip:6
    container_name: hubcap-glitchtip-migrate
    restart: "no"
    command: ./manage.py migrate --noinput
    environment:
      DATABASE_URL: ${DATABASE_URL:?Load DATABASE_URL from 1Password through Kamal}
      SECRET_KEY: ${SECRET_KEY:?Load SECRET_KEY from 1Password}
    depends_on:
      glitchtip-db:
        condition: service_healthy
    networks:
      - hubcap

  glitchtip-web:
    image: glitchtip/glitchtip:6
    container_name: hubcap-glitchtip-web
    restart: unless-stopped
    command: >
      uwsgi
        --module=glitchtip.wsgi:application
        --env DJANGO_SETTINGS_MODULE=glitchtip.settings
        --master --pidfile=/tmp/project-master.pid
        --log-x-forwarded-for --log-format-strftime
        --http-socket=:8080
        --workers=2
        --cheaper=1
        --cheaper-algo=busyness
        --cheaper-overload=30
        --cheaper-step=1
        --cheaper-busyness-max=50
        --cheaper-busyness-min=25
        --cheaper-busyness-multiplier=20
        --harakiri=120
        --max-requests=10000
        --worker-reload-mercy=10
        --die-on-term
        --enable-threads
        --single-interpreter
        --post-buffering
        --buffer-size=83146
        --ignore-sigpipe
        --ignore-write-errors
        --disable-write-exception
        --listen=128
    environment:
      DATABASE_URL: ${DATABASE_URL:?Load DATABASE_URL from 1Password through Kamal}
      SECRET_KEY: ${SECRET_KEY:?Load SECRET_KEY from 1Password}
      GLITCHTIP_DOMAIN: https://${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:?Set GLITCHTIP_FROM_EMAIL in .env}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:?Load GLITCHTIP_EMAIL_URL from 1Password}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:?Set GLITCHTIP_REDIS_URL in .env}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:?Set CELERY_WORKER_AUTOSCALE in .env}
      ENABLE_ORGANIZATION_CREATION: ${GLITCHTIP_ENABLE_ORG_CREATION:?Set GLITCHTIP_ENABLE_ORG_CREATION in .env}
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_REGISTRATION:?Set GLITCHTIP_ENABLE_REGISTRATION in .env}
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    networks:
      - hubcap

  glitchtip-worker:
    image: glitchtip/glitchtip:6
    container_name: hubcap-glitchtip-worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: ${DATABASE_URL:?Load DATABASE_URL from 1Password through Kamal}
      SECRET_KEY: ${SECRET_KEY:?Load SECRET_KEY from 1Password}
      GLITCHTIP_DOMAIN: https://${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:?Set GLITCHTIP_FROM_EMAIL in .env}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:?Load GLITCHTIP_EMAIL_URL from 1Password}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:?Set GLITCHTIP_REDIS_URL in .env}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:?Set CELERY_WORKER_AUTOSCALE in .env}
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    networks:
      - hubcap

  glitchtip-db:
    image: postgres:16-alpine
    container_name: hubcap-glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GLITCHTIP_DB_USER:?Set GLITCHTIP_DB_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Load POSTGRES_PASSWORD from 1Password}
      POSTGRES_DB: ${GLITCHTIP_DB_NAME:?Set GLITCHTIP_DB_NAME in .env}
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER:?Set GLITCHTIP_DB_USER in .env}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hubcap

  glitchtip-redis:
    image: redis:8-alpine
    container_name: hubcap-glitchtip-redis
    restart: unless-stopped
    networks:
      - hubcap

volumes:
  caddy_data:
  caddy_config:
  signoz_clickhouse:
  signoz_clickhouse_user_scripts:
  signoz_zookeeper:
  signoz_sqlite:
  glitchtip_db_data:

networks:
  hubcap:
    driver: bridge
